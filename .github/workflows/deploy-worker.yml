name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-higashimatsushima-reiki-mcp
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    # Pinned runner image (issue #31): validated with Node 22 and the action
    # versions below instead of the moving ubuntu-latest alias.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Test
        id: test
        continue-on-error: true
        run: npm test
      - name: Check published search index
        id: index
        if: steps.test.outcome == 'success'
        env:
          CACHE_BUSTER: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # Issue #42: the Worker must not be published while the Pages search
          # index is missing or half-updated, because search_laws_by_content
          # would answer with a Pages 404 for every query.
          set -euo pipefail
          base="https://toyfer.github.io/higashimatsushima-reiki-mcp"
          curl -fsS -H 'Cache-Control: no-cache' "$base/api/search/manifest.json?run=${CACHE_BUSTER}" -o manifest.json
          curl -fsS -H 'Cache-Control: no-cache' "$base/api/health.json?run=${CACHE_BUSTER}" -o health.json
          python3 - <<'PY'
          import json
          import sys

          manifest = json.load(open("manifest.json"))
          health = json.load(open("health.json"))
          version = manifest.get("data_version")
          problems = []
          if not version:
              problems.append("manifest has no data_version")
          if health.get("data_version") != version:
              problems.append(f"manifest data_version={version} but health data_version={health.get('data_version')}")
          if health.get("search_chunk_count") != manifest.get("chunk_count"):
              problems.append(f"manifest chunk_count={manifest.get('chunk_count')} but health search_chunk_count={health.get('search_chunk_count')}")
          files = manifest.get("files") or {}
          if not files.get("chunks") or not files.get("postings"):
              problems.append("manifest lists no chunk or posting shards")
          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              print("::error::Published Pages search index is not consistent. Run the Pages workflow with full_build=true before deploying the Worker.")
              sys.exit(1)
          print(f"published index ok: version={version} laws={manifest.get('law_count')} chunks={manifest.get('chunk_count')}")
          print(f"::notice::index_version={version}")
          PY
      - name: Write secrets file
        if: steps.test.outcome == 'success' && steps.index.outcome == 'success'
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          if [ -z "$AUTH_TOKEN" ]; then echo "::error::AUTH_TOKEN secret is not set"; exit 1; fi
          printf 'AUTH_TOKEN=%s\n' "$AUTH_TOKEN" > .secrets
          chmod 600 .secrets
      - name: Deploy
        id: deploy
        if: steps.test.outcome == 'success' && steps.index.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --secrets-file .secrets 2>&1 | tee deploy.log
      - name: Remove secrets file
        if: always()
        run: rm -f .secrets
      - name: Verify endpoints
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          set -euo pipefail
          sleep 10
          live=$(curl -s -o /dev/null -w "%{http_code}" https://higashimatsushima-reiki-mcp.toys-master.dev/live)
          echo "GET /live -> $live"; test "$live" = "200"
          health=$(curl -s -o /dev/null -w "%{http_code}" https://higashimatsushima-reiki-mcp.toys-master.dev/health)
          echo "GET /health -> $health"; test "$health" = "200"
          noauth=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://higashimatsushima-reiki-mcp.toys-master.dev/mcp -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          echo "POST /mcp no token -> $noauth"; test "$noauth" = "401"
          wrong=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://higashimatsushima-reiki-mcp.toys-master.dev/mcp -H 'Content-Type: application/json' -H 'Authorization: Bearer wrong-token-value' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          echo "POST /mcp wrong token -> $wrong"; test "$wrong" = "401"
          tools_list=$(curl -fsS -X POST https://higashimatsushima-reiki-mcp.toys-master.dev/mcp -H 'Content-Type: application/json' -H "Authorization: Bearer $AUTH_TOKEN" -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); names=[t.get("name") for t in d["result"]["tools"]]; expected=["reiki_status","search_laws_by_title","search_laws_by_content","get_law","get_article","get_toc","get_unit"]; missing=[n for n in expected if n not in names]; assert not missing, (missing, names); print("tools/list ok:", ", ".join(names))' "$tools_list"
          status_body=$(curl -fsS -X POST https://higashimatsushima-reiki-mcp.toys-master.dev/mcp -H 'Content-Type: application/json' -H "Authorization: Bearer $AUTH_TOKEN" -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"reiki_status","arguments":{}}}')
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert "error" not in d, d; texts=[c.get("text","") for c in d["result"]["content"]]; payload=json.loads(texts[0]); h=payload["health"]; assert h.get("ok") is True, h; assert h.get("failure_count")==0, h; assert h.get("expected_count")==h.get("law_count"), h; s=payload.get("search") or {}; assert s.get("published") is True, s; assert s.get("data_version")==h.get("data_version"), (s, h); print("reiki_status ok:", h.get("law_count"), "laws, search index", s.get("data_version"))' "$status_body"
          search_body=$(curl -fsS -X POST https://higashimatsushima-reiki-mcp.toys-master.dev/mcp -H 'Content-Type: application/json' -H "Authorization: Bearer $AUTH_TOKEN" -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"search_laws_by_content","arguments":{"query":"随意契約","limit":5}}}')
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert "error" not in d, d; r=d["result"]; assert not r.get("isError"), r; p=json.loads(r["content"][0]["text"]); assert p["count"]>=1, p; assert "truncated" in p, p; hits=[x for x in p["results"] if x.get("law_id") and x.get("source_url")]; assert hits, p; print("search_laws_by_content ok:", p["count"], "hits, data_version", p.get("data_version"), "truncated", p.get("truncated"))' "$search_body"
          toc_body=$(curl -fsS -X POST https://higashimatsushima-reiki-mcp.toys-master.dev/mcp -H 'Content-Type: application/json' -H "Authorization: Bearer $AUTH_TOKEN" -d '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"get_toc","arguments":{"law_id":"r122RG00000002","limit":5}}}')
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert "error" not in d, d; p=json.loads(d["result"]["content"][0]["text"]); assert p.get("article_count",0)>=1, p; print("get_toc ok:", p.get("article_count"), "articles on", p.get("title"))' "$toc_body"
          echo "POST /mcp valid token -> 200 tools/list + reiki_status + search + get_toc ok"
      - name: Report to issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          INDEX_OUTCOME: ${{ steps.index.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHA="${{ github.sha }}"
          if [ "$TEST_OUTCOME" != "success" ]; then STATUS=failure; elif [ "$INDEX_OUTCOME" != "success" ]; then STATUS=failure; elif [ "$DEPLOY_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then STATUS=success; else STATUS=failure; fi
          {
            echo "## Worker deploy $STATUS"
            echo
            echo "- run: $RUN_URL"
            echo "- sha: \`$SHA\`"
            echo "- test: $TEST_OUTCOME"
            echo "- index: ${INDEX_OUTCOME:-skipped}"
            echo "- deploy: ${DEPLOY_OUTCOME:-skipped}"
            echo "- verify: ${VERIFY_OUTCOME:-skipped}"
            echo
            echo "### log (tail)"
            echo '```'
            if [ -f deploy.log ]; then grep -v AUTH_TOKEN deploy.log | tail -c 4000; else echo "(no deploy.log)"; fi
            echo
            echo '```'
          } > report.md
          NUM=$(gh issue list --search "CI worker deploy log in:title" --state open --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            URL=$(gh issue create --title "CI worker deploy log" --body "Actions の Worker Deploy 結果。失敗時の wrangler ログを読む。")
            NUM=${URL##*/}
          fi
          gh issue comment "$NUM" --body-file report.md
      - name: Fail if test, index, deploy or verify failed
        if: always() && (steps.test.outcome != 'success' || steps.index.outcome != 'success' || steps.deploy.outcome != 'success' || steps.verify.outcome != 'success')
        run: exit 1
