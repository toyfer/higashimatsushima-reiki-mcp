name: Daily Higashimatsushima ordinance check

on:
  schedule:
    # 03:17 JST = 18:17 UTC on the previous day. A non-round minute reduces schedule congestion.
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check only detects the menu date/hash; collect also crawls index pages'
        required: true
        default: check
        type: choice
        options:
          - check
          - collect
      force_collect:
        description: 'Crawl index pages even when the menu page is unchanged'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: higashimatsushima-reiki-daily-check
  cancel-in-progress: false

jobs:
  check:
    name: Check ordinance pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Issue #66: the reusable full-build job below decides from these outputs
    # whether the city site really changed, so no crawl happens on a quiet day.
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      current_date: ${{ steps.check.outputs.current_date }}
      law_count: ${{ steps.check.outputs.law_count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test checker
        run: python -m unittest discover -s tests -v

      - name: Run daily check
        id: check
        env:
          RUN_MODE: ${{ inputs.mode || 'check' }}
          FORCE_COLLECT: ${{ inputs.force_collect || false }}
        run: |
          args=(--mode "$RUN_MODE")
          if [ "$FORCE_COLLECT" = "true" ]; then
            args+=(--force-collect)
          fi
          python scripts/daily_check.py "${args[@]}"

      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reiki-status-${{ github.run_id }}
          path: |
            data/status/latest.json
            data/status/latest-summary.md
          if-no-files-found: warn
          retention-days: 30

      - name: Commit updated status
        if: success()
        env:
          CHANGED: ${{ steps.check.outputs.changed }}
        run: |
          if git diff --quiet -- data/status/latest.json data/status/latest-summary.md; then
            echo "No status file changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status/latest.json data/status/latest-summary.md
          git commit -m "chore: update ordinance check status"
          git push

      - name: Open or update issue when the site changed
        if: success() && steps.check.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          CURRENT_DATE: ${{ steps.check.outputs.current_date }}
          LAW_COUNT: ${{ steps.check.outputs.law_count }}
        with:
          script: |
            const fs = require('fs');
            const summary = fs.existsSync('data/status/latest-summary.md')
              ? fs.readFileSync('data/status/latest-summary.md', 'utf8')
              : 'No summary file was generated.';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const titleDate = process.env.CURRENT_DATE || new Date().toISOString().slice(0, 10);
            const title = `Ordinance index changed: ${titleDate}`;
            const body = `${summary}\n\nRun: ${runUrl}`;
            async function findOpenIssueByTitle(wantedTitle) {
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              });
              return issues.data.find((issue) => !issue.pull_request && issue.title === wantedTitle) || null;
            }
            async function createIssue(payload) {
              try {
                return await github.rest.issues.create({ ...payload, labels: ['reiki-update'] });
              } catch (labelError) {
                core.warning(`Issue creation with label failed: ${labelError.message}`);
                try {
                  return await github.rest.issues.create(payload);
                } catch (plainError) {
                  core.setFailed(`Issue creation failed: ${plainError.message}`);
                  throw plainError;
                }
              }
            }
            const existing = await findOpenIssueByTitle(title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `The ordinance site changed again for the same content date.\n\n${body}`
              });
            } else {
              await createIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Daily ordinance check failed';
            const body = `The daily check failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            async function findOpenFailureIssue() {
              const labeled = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'reiki-check-failure',
                per_page: 10
              });
              const labeledIssue = labeled.data.find((issue) => !issue.pull_request);
              if (labeledIssue) return labeledIssue;
              const open = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              });
              return open.data.find((issue) => !issue.pull_request && issue.title === title) || null;
            }
            async function createFailureIssue() {
              const payload = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              };
              try {
                return await github.rest.issues.create({ ...payload, labels: ['reiki-check-failure'] });
              } catch (labelError) {
                core.warning(`Failure issue creation with label failed: ${labelError.message}`);
                try {
                  return await github.rest.issues.create(payload);
                } catch (plainError) {
                  core.setFailed(`Failure issue creation failed: ${plainError.message}`);
                  throw plainError;
                }
              }
            }
            const existing = await findOpenFailureIssue();
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await createFailureIssue();
            }

  # Issue #66: GitHub does not start on: push workflows from a push made with
  # GITHUB_TOKEN, so a status commit could never reach Pages on its own. The
  # reusable workflow is called directly instead, and only when the menu page
  # really changed. Quiet days stay at one request to the city site.
  full-build:
    name: Full build and deploy after a change
    needs: check
    if: needs.check.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      full_build: true
      allow_sample_overwrite: false
      delay_seconds: '0.35'
