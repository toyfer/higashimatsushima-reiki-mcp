name: Deploy static ordinance API to GitHub Pages

# Three automated paths reach the published API without a manual dispatch
# (issue #66):
#   1. push to main that touches the parser/index/builder scripts -> full build
#      so a merged fix reaches Pages immediately.
#   2. workflow_call from daily-reiki-check.yml when the city site changed.
#   3. a weekly schedule as insurance for body-only replacements that keep the
#      menu hash and 内容現在日 unchanged.
# A push that only refreshes data/status/latest.json still runs the cheap
# sample path, and the fail-closed guard below still refuses to downgrade a
# larger published API with the 5-law sample.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build_static_api.py'
      - 'scripts/parse_honbun.py'
      - 'scripts/search_index.py'
      - 'scripts/reiki_common.py'
      - 'scripts/daily_check.py'
      - 'data/status/latest.json'
      - '.github/workflows/pages.yml'
  schedule:
    # Sunday 04:17 JST (Saturday 19:17 UTC): weekly insurance build, one hour
    # after the daily check, so the two never queue behind each other.
    - cron: '17 19 * * 6'
  workflow_dispatch:
    inputs:
      full_build:
        description: 'Build every ordinance body into site/api before deploying'
        required: true
        default: false
        type: boolean
      allow_sample_overwrite:
        description: 'Explicitly allow a 5-law sample run to overwrite a larger published API. Ignored when full_build=true'
        required: true
        default: false
        type: boolean
      delay_seconds:
        description: 'Delay between ordinance page fetches'
        required: true
        default: '0.35'
        type: string
  workflow_call:
    inputs:
      status_artifact:
        description: 'Artifact name holding data/status from the calling workflow. When set, the status is restored and index collection is skipped'
        required: false
        default: ''
        type: string
      full_build:
        description: 'Build every ordinance body into site/api before deploying'
        required: false
        default: true
        type: boolean
      allow_sample_overwrite:
        description: 'Explicitly allow a 5-law sample run to overwrite a larger published API. Ignored when full_build=true'
        required: false
        default: false
        type: boolean
      delay_seconds:
        description: 'Delay between ordinance page fetches'
        required: false
        default: '0.35'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GitHub Pages
    # Pinned runner image (issue #31): the Python 3.12, Node 22 and action
    # versions below are validated against this image and not against a moving
    # ubuntu-latest alias.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history: a merged pull request makes github.event.before the
          # tip of the previous branch tip, which can be many commits back, and
          # a shallow clone would make the diff below silently skip the build.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test builders
        run: python -m unittest discover -s tests -v

      - name: Guard against sample downgrade of a full deployment
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_BUILD: ${{ inputs.full_build }}
          ALLOW_SAMPLE_OVERWRITE: ${{ inputs.allow_sample_overwrite }}
          CACHE_BUSTER: ${{ github.run_id }}-${{ github.run_attempt }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Issues #27/#29/#33: fail closed whenever the published state cannot
          # be established, including manual runs. Only an explicit
          # full_build=true refresh, a builder change, a scheduled run, or an
          # explicit allow_sample_overwrite=true after a successfully parsed
          # health.json may replace a larger published API with the 5-law sample.
          #
          # health.json is requested with a per-run cache buster and a no-cache
          # request header so a CDN copy from before a full deployment cannot be
          # mistaken for the current published state.
          #
          # Issue #66: a merged parser/index/builder change must reach Pages on
          # its own. The change is detected here from the pushed diff instead of
          # the workflow path filter, which cannot distinguish a script edit from
          # a status-only update.
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "skip_sample=false" >> "$GITHUB_OUTPUT"
            echo "scheduled full build"
            exit 0
          fi
          if { [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "workflow_call" ]; } && [ "$FULL_BUILD" = "true" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "skip_sample=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            if git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" -- \
              scripts/parse_honbun.py \
              scripts/search_index.py \
              scripts/build_static_api.py \
              scripts/reiki_common.py | grep -q .; then
              echo "mode=full" >> "$GITHUB_OUTPUT"
              echo "skip_sample=false" >> "$GITHUB_OUTPUT"
              echo "builder or parser changed; using full build"
              exit 0
            fi
          fi
          health_json=$(mktemp)
          health_url="https://toyfer.github.io/higashimatsushima-reiki-mcp/api/health.json?run=${CACHE_BUSTER}"
          if ! curl -fsS -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$health_url" -o "$health_json"; then
            echo "::error::Could not fetch published api/health.json. Refusing to build or deploy so the current published API is preserved. Re-run with full_build=true to rebuild the full API."
            exit 1
          fi
          if ! published_count=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); v=d.get('law_count'); assert isinstance(v,int) and not isinstance(v,bool) and v>=0, v; print(v)" "$health_json"); then
            echo "::error::Published api/health.json was unparsable or law_count was invalid. Refusing to build or deploy so the current published API is preserved. Re-run with full_build=true to rebuild the full API."
            exit 1
          fi
          published_detail=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(f\"ok={d.get('ok')} expected={d.get('expected_count')} failure={d.get('failure_count')} version={d.get('data_version')}\")" "$health_json")
          published_ok=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('true' if d.get('ok') is True else 'false')" "$health_json")
          echo "Published law_count: $published_count ($published_detail)"
          echo "published_count=$published_count" >> "$GITHUB_OUTPUT"
          echo "published_ok=$published_ok" >> "$GITHUB_OUTPUT"
          # Issue #74: the pushed diff alone cannot prove the published API is
          # current. When an earlier push in the same batch was cancelled, the
          # later docs-only push would find no builder change in its own diff and
          # skip, leaving parser fixes unpublished. Compare against the commit
          # that produced the published build instead.
          published_commit=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('commit_sha') or '')" "$health_json")
          echo "published_commit=${published_commit:-unknown}"
          if [ "$EVENT_NAME" = "push" ] && [ -n "$published_commit" ] && git cat-file -e "${published_commit}^{commit}" 2>/dev/null; then
            if git diff --name-only "$published_commit" "$HEAD_SHA" -- \
              scripts/parse_honbun.py \
              scripts/search_index.py \
              scripts/build_static_api.py \
              scripts/reiki_common.py | grep -q .; then
              echo "mode=full" >> "$GITHUB_OUTPUT"
              echo "skip_sample=false" >> "$GITHUB_OUTPUT"
              echo "builder or parser changed since the published build; using full build"
              exit 0
            fi
          fi
          if [ "$published_count" -gt 5 ]; then
            if { [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "workflow_call" ]; } && [ "$ALLOW_SAMPLE_OVERWRITE" = "true" ]; then
              echo "::warning::Published API already has $published_count laws. allow_sample_overwrite=true was set explicitly, so this manual sample run will overwrite it with 5 laws."
              echo "mode=sample" >> "$GITHUB_OUTPUT"
              echo "skip_sample=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "skip_sample=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Published API already has $published_count laws. Skipping sample deploy to avoid downgrading it. Run this workflow manually with full_build=true to refresh the full API, or set allow_sample_overwrite=true to intentionally overwrite with the 5-law sample."
            exit 0
          fi
          echo "mode=sample" >> "$GITHUB_OUTPUT"
          echo "skip_sample=false" >> "$GITHUB_OUTPUT"

      - name: Check whether the ordinance index changed
        id: index_changed
        if: steps.guard.outputs.mode != 'full'
        run: |
          changed=$(python3 -c "import json; print(str(json.load(open('data/status/latest.json')).get('changed', False)).lower())")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Index changed: $changed"

      - name: Restore status from the calling workflow
        if: inputs.status_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.status_artifact }}
          path: data/status

      - name: Collect ordinance index
        # Skipped when the caller already crawled the index pages and handed
        # over the fresh status file, so a changed day does not crawl 74 pages
        # twice and never builds from the pre-commit status.
        if: steps.guard.outputs.mode == 'full' && inputs.status_artifact == ''
        run: python scripts/daily_check.py --mode collect --delay 0.35

      - name: Build full static API
        if: steps.guard.outputs.mode == 'full'
        env:
          # push and schedule events have no inputs, so the fallback is required
          # or the empty string reaches --delay and the script exits at once.
          BUILD_DELAY: ${{ inputs.delay_seconds || '0.35' }}
          BUILD_COMMIT: ${{ github.sha }}
        run: python scripts/build_static_api.py --delay "$BUILD_DELAY" --fail-on-error

      - name: Build sample static API
        if: steps.guard.outputs.mode == 'sample' && steps.index_changed.outputs.changed == 'true'
        env:
          BUILD_DELAY: ${{ inputs.delay_seconds || '0.35' }}
          BUILD_COMMIT: ${{ github.sha }}
        run: python scripts/build_static_api.py --limit 5 --delay "$BUILD_DELAY"

      - name: Skip deployment notice
        if: steps.guard.outputs.mode == 'skip'
        run: echo "Sample build and deployment were skipped because a larger full API is already published."

      - name: Unchanged index notice
        if: steps.guard.outputs.mode == 'sample' && steps.index_changed.outputs.changed != 'true'
        run: echo "Ordinance index did not change. Skipping city-site collection, sample build and deployment."

      - name: Verify search index artifacts
        if: steps.guard.outputs.mode == 'full' || (steps.guard.outputs.mode == 'sample' && steps.index_changed.outputs.changed == 'true')
        run: |
          # Issue #42: a Worker deploy that serves search_laws_by_content must not
          # reach Pages before the bigram index actually exists. Fail here instead
          # of publishing a site where /api/search/manifest.json would 404.
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          api = pathlib.Path("site/api")
          search = api / "search"
          problems = []

          manifest_path = search / "manifest.json"
          if not manifest_path.exists():
              print(f"::error::missing {manifest_path}; run the full build so the body search index is published")
              sys.exit(1)

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          health = json.loads((api / "health.json").read_text(encoding="utf-8"))

          for key in ("data_version", "law_count", "chunk_count", "chunk_shard_size", "posting_shards", "files"):
              if key not in manifest:
                  problems.append(f"manifest_missing_field:{key}")
          if manifest.get("data_version") != health.get("data_version"):
              problems.append(f"manifest_version_mismatch:manifest={manifest.get('data_version')}:health={health.get('data_version')}")
          if manifest.get("chunk_count") != health.get("search_chunk_count"):
              problems.append(f"chunk_count_mismatch:manifest={manifest.get('chunk_count')}:health={health.get('search_chunk_count')}")
          if manifest.get("law_count") != health.get("law_count"):
              problems.append(f"law_count_mismatch:manifest={manifest.get('law_count')}:health={health.get('law_count')}")

          files = manifest.get("files") or {}
          expected = list(files.get("chunks") or []) + list(files.get("postings") or [])
          if not expected:
              problems.append("manifest_files_empty")
          for name in expected:
              if not (search / name).exists():
                  problems.append(f"missing_shard:{name}")

          for name in expected:
              path = search / name
              if not path.exists():
                  continue
              shard = json.loads(path.read_text(encoding="utf-8"))
              if shard.get("data_version") != manifest.get("data_version"):
                  problems.append(f"shard_version_mismatch:{name}")

          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)

          print(
              "search index ok: version={} laws={} chunks={} shards={}".format(
                  manifest.get("data_version"),
                  manifest.get("law_count"),
                  manifest.get("chunk_count"),
                  len(expected),
              )
          )
          PY

      - name: Set up GitHub Pages
        if: steps.guard.outputs.mode == 'full' || (steps.guard.outputs.mode == 'sample' && steps.index_changed.outputs.changed == 'true')
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        if: steps.guard.outputs.mode == 'full' || (steps.guard.outputs.mode == 'sample' && steps.index_changed.outputs.changed == 'true')
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.guard.outputs.mode == 'full' || (steps.guard.outputs.mode == 'sample' && steps.index_changed.outputs.changed == 'true')
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Report why the deploy was skipped
        if: steps.guard.outputs.mode == 'skip'
        run: |
          echo "### Sample deploy skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "The published API already holds ${PUBLISHED_COUNT:-many} laws, so this run did not deploy." >> "$GITHUB_STEP_SUMMARY"
          echo "A merged parser or index change triggers a full build automatically; otherwise dispatch this workflow with full_build=true." >> "$GITHUB_STEP_SUMMARY"
